apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiaos-backend
  labels:
    app: hiaos
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hiaos
      component: backend
  template:
    metadata:
      labels:
        app: hiaos
        component: backend
    spec:
      containers:
        - name: backend
          image: hiaos/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hiaos-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hiaos-secrets
                  key: secret-key
            - name: ENVIRONMENT
              value: production
            - name: AUTO_CREATE_TABLES
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hiaos-backend
spec:
  selector:
    app: hiaos
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiaos-frontend
  labels:
    app: hiaos
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hiaos
      component: frontend
  template:
    metadata:
      labels:
        app: hiaos
        component: frontend
    spec:
      containers:
        - name: frontend
          image: hiaos/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hiaos-frontend
spec:
  selector:
    app: hiaos
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hiaos-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hiaos.example.com
      secretName: hiaos-tls
  rules:
    - host: hiaos.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hiaos-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hiaos-frontend
                port:
                  number: 80
