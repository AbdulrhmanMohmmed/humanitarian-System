[project]
name = "humanitarian-system"
version = "1.0.0"
description = "نظام إدارة العمل الإنساني - اليمن"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "sqlalchemy==2.0.35",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "openpyxl==3.1.5",
    "python-dateutil==2.9.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
