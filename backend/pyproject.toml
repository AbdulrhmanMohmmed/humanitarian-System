[project]
name = "humanitarian-system"
version = "1.0.0"
description = "نظام إدارة العمل الإنساني - اليمن"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "sqlalchemy==2.0.35",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "python-multipart==0.0.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "openpyxl==3.1.5",
    "python-dateutil==2.9.0",
    "python-docx==1.1.2",
    "alembic==1.13.2",
    "aiosqlite==0.20.0",
    "pytest==8.3.3",
    "httpx==0.27.2",
    "psycopg[binary]==3.2.3",
    "redis==5.2.1",
    "celery==5.4.0",
    "boto3==1.35.36",
    "strawberry-graphql[fastapi]==0.246.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
